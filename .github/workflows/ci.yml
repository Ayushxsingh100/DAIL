name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Doc 15 §7.3 exit criterion "No secrets required for core tests": the quality
  # job deliberately uses no secrets and no environment variables beyond what
  # GitHub provides. A PR that needs a secret for this job to go green violates
  # P0 and must be revised, not this workflow.
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Core tests with zero installed packages (Doc 15 §7.3)
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Install locked dev toolchain
        run: |
          python -m pip install --require-hashes -r requirements/dev.lock
          python -m pip install --no-deps -e .
      - name: Formatting (black)
        run: black --check .
      - name: Lint (ruff)
        run: ruff check .
      - name: Static analysis (mypy --strict)
        run: mypy
      - name: Unit, contract, integration, adversarial tests (pytest)
        run: pytest --cov=core --cov=evidence --cov-report=term-missing
      - name: Build/package
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Dependency scan (pip-audit)
        run: pip-audit --require-hashes -r requirements/dev.lock

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform:
    name: terraform
    runs-on: ubuntu-latest
    env:
      TF_VERSION: "1.15.8"
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Terraform (checksum-verified)
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
          curl -fsSLO "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_SHA256SUMS"
          grep " terraform_${TF_VERSION}_linux_amd64.zip$" "terraform_${TF_VERSION}_SHA256SUMS" | sha256sum -c -
          unzip -q "terraform_${TF_VERSION}_linux_amd64.zip" -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: terraform version
      - run: terraform fmt -check -recursive infrastructure/terraform
      - run: terraform -chdir=infrastructure/terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infrastructure/terraform validate
