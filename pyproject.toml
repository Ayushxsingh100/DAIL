[project]
name = "cloudspartanx"
version = "0.1.0"
description = "DAIL - Dependency-Aware Invariant Ledger for Stateful Promotion of Iterative LLM-Generated Terraform Infrastructure States"
requires-python = ">=3.12,<3.13"
readme = "README.md"

# --- Phase-gated dependencies -----------------------------------------------
# P0/P1 (current phase) intentionally have ZERO external runtime dependencies:
# domain models use the standard library only (dataclasses + enum + hashlib +
# json + sqlite3). This keeps "fresh clone can bootstrap" trivially true and
# means core safety-critical logic can be tested with no network access and
# no secrets, per the Development & DevOps Specification (Doc 14) and the
# Implementation Roadmap (Doc 15) P0 exit criteria.
#
# The dependencies below are declared now (version-pinned, per Doc 14 Section 7
# "Version Pinning") so the phases that need them are unblocked when reached,
# but nothing before P3 should import from outside the standard library.
dependencies = []

[project.optional-dependencies]
# P1 hardening (optional now): stricter runtime validation than hand-rolled
# dataclass __post_init__ checks. Swap-in target once network access exists.
validation = [
    "pydantic==2.9.2",
]
# P2 (Evidence) / P9 (AWS-Terraform integration) persistence hardening.
persistence = [
    "sqlalchemy==2.0.35",
]
# P3 (Identity/Dependency graph engine).
graph = [
    "networkx==3.6.1",           # already present in this sandbox; pin matches it
]
# P5 (Verification engine) - security verifier.
verification = [
    "checkov==3.2.526",
]
# P7 (LLM integration) - provider-agnostic adapter + structured output.
llm = [
    "litellm==1.51.0",
    "instructor==1.6.4",
    "pydantic==2.9.2",
]
# P8 (Experiment harness) - AWS SDK for oracle validation (Reachability
# Analyzer, live TCP tests) and Config/KICS cross-validation.
aws = [
    "boto3==1.35.36",
]
# Developer tooling: formatter, linter, type checker, test runner.
dev = [
    "black==24.10.0",
    "ruff==0.7.0",
    "mypy==1.13.0",
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "evidence*"]

# --- Formatter ---------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py312"]

# --- Linter --------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG"]
ignore = []

# --- Type checker -----------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
# LLM/AWS-adapter modules get relaxed typing rules once they exist (P7/P9),
# since third-party stubs for litellm/boto3 are inconsistent; core.domain and
# core.identity/dependency/impact/verification/promotion must stay strict.

# --- Tests -------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "unit: fast, no I/O, no network (default tier)",
    "integration: touches local sqlite or filesystem",
    "contract: verifies a documented data contract (Doc 15 Core Contracts)",
    "adversarial: negative/malicious-input safety tests (Doc 14 Section 2)",
    "e2e: full pipeline, requires fixtures",
]
