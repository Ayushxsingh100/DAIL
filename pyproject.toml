[project]
name = "cloudspartanx"
version = "0.1.0"
description = "DAIL - Dependency-Aware Invariant Ledger for Stateful Promotion of Iterative LLM-Generated Terraform Infrastructure States"
requires-python = ">=3.12,<3.13"
readme = "README.md"

# --- Phase-gated dependencies -----------------------------------------------
# core/ and evidence/ use the Python 3.12 standard library only (ADR-002,
# ADR-004), so a fresh clone can bootstrap and run the core tests with no
# network access and no secrets (Doc 15 §7.3). Any third-party import in core/
# needs its own ADR (the known future exception is networkx, ADR-005, P3c).
dependencies = []

[project.optional-dependencies]
# Later-phase groups: declared, never installed; re-verified and locked when
# their phase starts (ADR-002). Pydantic and SQLAlchemy are not used in the
# core (ADR-004).
# P3c (dependency graph, ADR-005).
# declared, never installed; re-verified and locked when phase P3c starts
graph = [
    "networkx==3.6.1",
]
# P5a (verification); Checkov is recorded as an advisory cross-check only (C-12).
# declared, never installed; re-verified and locked when phase P5a starts
verification = [
    "checkov==3.2.526",
]
# P7a (LLM integration); Pydantic is permitted only inside llm/ (ADR-004).
# declared, never installed; re-verified and locked when phase P7a starts
llm = [
    "litellm==1.51.0",
    "instructor==1.6.4",
    "pydantic==2.9.2",
]
# P9 (AWS adapter behind AWSPort, Doc 04 §13).
# declared, never installed; re-verified and locked when phase P9 starts
aws = [
    "boto3==1.35.36",
]
# Developer tooling: formatter, linter, type checker, test runner, dependency
# scanner. Exact pins; hash-locked in requirements/dev.lock (ADR-002).
dev = [
    "black==26.3.1",
    "ruff==0.7.0",
    "mypy==1.13.0",
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pip-audit>=2.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "evidence*", "llm*"]

# --- Formatter ---------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py312"]

# --- Linter --------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG"]
ignore = []

# --- Type checker -----------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
# Tests are not type-checked.
files = ["core", "evidence", "scripts"]
# LLM/AWS-adapter modules get relaxed typing rules once they exist (P7/P9),
# since third-party stubs for litellm/boto3 are inconsistent; core.domain and
# core.identity/dependency/impact/verification/promotion must stay strict.

[[tool.mypy.overrides]]
# TEMPORARY - modules scheduled for rewrite in P1a. Remove this override in P1a.
module = ["core.domain.enums", "core.domain.invariant", "core.domain.state",
          "core.domain.resource", "core.domain.storage"]
ignore_errors = true

# --- Tests -------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "unit: fast, no I/O, no network (default tier)",
    "integration: touches local sqlite or filesystem",
    "contract: verifies a documented data contract (Doc 15 Core Contracts)",
    "adversarial: negative/malicious-input safety tests (Doc 14 Section 2)",
    "e2e: full pipeline, requires fixtures",
]
